name: CI

# main은 항상 green을 유지한다(트렁크 기반, docs/conventions.md).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: format · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check (포맷 강제)
        run: ./gradlew spotlessCheck

      - name: Test (ArchUnit 경계 포함)
        run: ./gradlew test

  secret-scan:
    name: gitleaks (비밀 유출 스캔)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
