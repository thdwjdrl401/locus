# SUT(타깃 박스)의 의존 인프라. 앱은 M8 전까지 호스트 JVM에서 직접 실행한다.
# 관측 스택(prometheus/grafana)은 박스 밖(맥북)에서 → docker-compose.monitoring.yml.
#
# 점증 원칙: 한 마일스톤에 파이프라인 인프라 둘 이상 동시에 올리지 않는다.
#   M0: mysql (아래)
#   M2: kafka  ← 해당 마일스톤에서 추가
#   M4: redis  ← 해당 마일스톤에서 추가
#
# 기동: docker compose up -d
# 버전 고정(재현성): 측정이 비교 가능하려면 떠다니는 태그를 쓰지 않는다.

services:
  mysql:
    image: mysql:8.0.40
    container_name: locus-mysql
    environment:
      # .env가 있으면 그 값을, 없으면 throwaway 기본값 (cp .env.example .env)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-locus}
      MYSQL_USER: ${MYSQL_USER:-locus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-locuspw}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 측정 튜닝(8GB 박스): 버퍼풀 고정 → M0·M7 비교 가능. 내구성은 기본값(실 타깃 모습).
      - --innodb-buffer-pool-size=2G
    healthcheck:
      # $$ -> 컨테이너 셸에서 $MYSQL_ROOT_PASSWORD 로 확장 (compose 치환 아님)
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
