# SUT(타깃 박스)의 의존 인프라. 앱은 M8 전까지 호스트 JVM에서 직접 실행한다.
# 관측 스택(prometheus/grafana)은 박스 밖(맥북)에서 → docker-compose.monitoring.yml.
#
# 점증 원칙: 한 마일스톤에 파이프라인 인프라 둘 이상 동시에 올리지 않는다.
#   M2: timescaledb (MySQL → TimescaleDB 전환, ADR 0008)
#   M4: redis  ← 해당 마일스톤에서 추가
#
# 기동: docker compose up -d
# 버전 고정(재현성): 측정이 비교 가능하려면 떠다니는 태그를 쓰지 않는다.

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: locus-timescaledb
    environment:
      # .env가 있으면 그 값을, 없으면 throwaway 기본값 (cp .env.example .env)
      POSTGRES_DB: ${POSTGRES_DB:-locus}
      POSTGRES_USER: ${POSTGRES_USER:-locus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locuspw}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Locus를 박스의 ≈3/4로 격리(시스템 서비스+OS에 1/4 예약). 8c 중 0–5, 메모리 3G 상한.
    # 앱(호스트 JVM)은 taskset -c 0-5 + -Xmx1500m로 같은 경계 안. 합 ≈ 6G ≤ 8G(스왑 회피).
    cpuset: "0-5"
    mem_limit: 3g
    # 측정 튜닝: shared_buffers를 M0/M1의 MySQL buffer-pool 2G와 맞춰 비교 가능하게(엔진 외 변수 고정).
    # shared_preload_libraries=timescaledb는 확장 로드 보장(Flyway CREATE EXTENSION 전제).
    command:
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - shared_buffers=2GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 호스트(박스) 메트릭 노출 — 디스크 %util·쓰기 지연·평균 요청 크기 등을 9100으로.
  # 측정 시 iostat 로그 대신 Prometheus가 긁어 Grafana로 본다. (관측 사이드카 — 파이프라인 인프라 아님, §3.4 무관)
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: locus-node-exporter
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
    restart: unless-stopped

volumes:
  postgres-data:
