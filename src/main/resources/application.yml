spring:
  application:
    name: locus

  # M2: TimescaleDB(PostgreSQL). docker-compose의 timescaledb 서비스와 짝.
  # 자격증명은 env로 외부화(public 레포). 기본값은 로컬 docker-compose 전용 throwaway.
  # 실제 배포는 DB_URL/DB_USERNAME/DB_PASSWORD 주입. (SECURITY.md 참조)
  datasource:
    # reWriteBatchedInserts=true: PostgreSQL에서 JdbcTemplate.batchUpdate가 멀티로우 INSERT로 묶이게 한다
    # (MySQL의 rewriteBatchedStatements에 해당 — M1 A2 배치 적재의 전제).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/locus?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:locus}
    password: ${DB_PASSWORD:locuspw}
    driver-class-name: org.postgresql.Driver
    # 배치 워커 N개가 각자 커넥션 1개를 쓴다(M2-par) → 풀은 워커 수 이상으로.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:16}

  jpa:
    hibernate:
      # M2~: ddl-auto=validate. 스키마는 Flyway(db/migration/V1__init_schema.sql) 소유.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# 측정 인프라 (M0부터): Actuator -> Prometheus 스크레이프
management:
  endpoints:
    web:
      exposure:
        # M1에서 GC/스레드/풀 메트릭을 더 노출. 운영에선 노출 범위를 좁힌다.
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: locus
    distribution:
      # 수집 API의 지연 백분위(p95/p99)와 히스토그램을 Prometheus로 노출 → Grafana baseline
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95, 0.99
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8093
  # 수집 인테이크 튜닝 — queue 모드에서 HTTP 요청은 큐에 넣고 즉시 202(빠름)라,
  # 천장은 워커/스토리지여야 한다. 기본 커넥터 한계(M2 측정에서 ~2,200에 커넥션 레벨 붕괴)를 올려
  # 인테이크가 측정의 교란변수가 되지 않게 한다.
  tomcat:
    threads:
      max: 300 # 기본 200. 요청이 1ms라 충분.
    accept-count: 4096 # 기본 100. 도착 버스트 흡수(박스 net.core.somaxconn도 같이 상향).
    max-connections: 20000 # 기본 8192.
    max-keep-alive-requests: -1 # 기본 100 → 무제한. 고RPS에서 커넥션 재사용(처닝·TIME_WAIT 회피).

# 수집 적재 전략 (M1 fsync 분할 실험). 자세한 설명은 IngestProperties / measurements/M1.md.
locus:
  ingest:
    # direct(기본, A0=요청당 단건 저장) | queue(A2=인메모리 큐 + 워커 배치)
    mode: ${INGEST_MODE:direct}
    queue-capacity: ${INGEST_QUEUE_CAPACITY:10000}
    batch-size: ${INGEST_BATCH_SIZE:500}
    max-delay-ms: ${INGEST_MAX_DELAY_MS:200}
    # false면 Device upsert 생략 = A2-x(핫패스 UPDATE 교란변수 격리)
    device-upsert: ${INGEST_DEVICE_UPSERT:true}
    # 배치 워커 스레드 수(M2-par 병렬화). 단일 워커 처리율 한계를 넘김. DB_POOL_MAX 이하로.
    workers: ${INGEST_WORKERS:1}

logging:
  level:
    com.thdwjdrl.locus: INFO
