spring:
  application:
    name: locus

  # M0: MySQL 단일. docker-compose의 mysql 서비스와 짝.
  # 자격증명은 env로 외부화(public 레포). 기본값은 로컬 docker-compose 전용 throwaway.
  # 실제 배포는 DB_URL/DB_USERNAME/DB_PASSWORD 주입. (SECURITY.md 참조)
  datasource:
    # rewriteBatchedStatements=true: JdbcTemplate.batchUpdate가 멀티로우 INSERT로 묶이게 한다(M1 A2 배치 적재의 전제).
    url: ${DB_URL:jdbc:mysql://localhost:3306/locus?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:locus}
    password: ${DB_PASSWORD:locuspw}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # M0는 ddl-auto=update로 빠르게. 스키마가 안정되면 validate + Flyway 도입 검토.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# 측정 인프라 (M0부터): Actuator -> Prometheus 스크레이프
management:
  endpoints:
    web:
      exposure:
        # M1에서 GC/스레드/풀 메트릭을 더 노출. 운영에선 노출 범위를 좁힌다.
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: locus
    distribution:
      # 수집 API의 지연 백분위(p95/p99)와 히스토그램을 Prometheus로 노출 → Grafana baseline
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95, 0.99
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8093

# 수집 적재 전략 (M1 fsync 분할 실험). 자세한 설명은 IngestProperties / measurements/M1.md.
locus:
  ingest:
    # direct(기본, A0=요청당 단건 저장) | queue(A2=인메모리 큐 + 워커 배치)
    mode: ${INGEST_MODE:direct}
    queue-capacity: ${INGEST_QUEUE_CAPACITY:10000}
    batch-size: ${INGEST_BATCH_SIZE:500}
    max-delay-ms: ${INGEST_MAX_DELAY_MS:200}
    # false면 Device upsert 생략 = A2-x(핫패스 UPDATE 교란변수 격리)
    device-upsert: ${INGEST_DEVICE_UPSERT:true}

logging:
  level:
    com.thdwjdrl.locus: INFO
