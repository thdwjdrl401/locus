<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locus — 관제</title>
    <!-- Leaflet + OpenStreetMap 타일 (API 키 불필요). 실시간 = STOMP over WebSocket 푸시(M4b). -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #map {
        height: 100%;
      }
      #hud {
        position: absolute;
        z-index: 1000;
        top: 10px;
        left: 50px;
        background: rgba(255, 255, 255, 0.92);
        padding: 8px 12px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 13px;
      }
      #hud b {
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div>Locus 관제 — <b id="count">0</b>대 <span id="org" style="color: #888"></span></div>
      <div id="status" style="color: #666">…</div>
    </div>
    <div id="map"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <script>
      // 조직 스코프 — URL ?org=org-3 로 지정, 기본 org-0. 접속 시 스냅샷 1회 + 이후 델타 push.
      const ORG = new URLSearchParams(location.search).get("org") || "org-0";

      const map = L.map("map").setView([37.5, 127.0], 13); // 서울 근처(시뮬레이터 기본)
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap",
      }).addTo(map);

      const markers = new Map(); // deviceId -> L.marker
      const countEl = document.getElementById("count");
      const statusEl = document.getElementById("status");
      document.getElementById("org").textContent = "(" + ORG + ")";

      function status(msg, err) {
        statusEl.textContent = msg;
        statusEl.style.color = err ? "#c00" : "#666";
      }

      // 한 디바이스 최신 프레임으로 마커 생성/갱신 (스냅샷·push 공용).
      function upsert(t) {
        if (!t.location || t.location.lat == null || t.location.lng == null) return;
        const ll = [t.location.lat, t.location.lng];
        const popup = `<b>${t.deviceId}</b><br/>${new Date(t.recordedAt).toLocaleTimeString()}`;
        let m = markers.get(t.deviceId);
        if (m) {
          m.setLatLng(ll).setPopupContent(popup);
        } else {
          m = L.marker(ll).addTo(map).bindPopup(popup);
          markers.set(t.deviceId, m);
        }
        countEl.textContent = markers.size;
      }

      // 1) 접속 시 현재 상태 스냅샷 (LATERAL 조회, O(디바이스)).
      async function snapshot() {
        const res = await fetch("/api/telemetry/latest?org=" + encodeURIComponent(ORG), {
          cache: "no-store",
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        for (const t of await res.json()) upsert(t);
      }

      // 2) 이후 갱신은 STOMP 토픽 push (폴링 없음).
      function connect() {
        const client = new StompJs.Client({
          webSocketFactory: () => new SockJS("/ws"),
          reconnectDelay: 2000,
          onConnect: () => {
            client.subscribe("/topic/org/" + ORG, (msg) => upsert(JSON.parse(msg.body)));
            status("실시간 연결됨 · " + new Date().toLocaleTimeString());
          },
          onStompError: (f) => status("STOMP 오류: " + f.headers["message"], true),
          onWebSocketClose: () => status("연결 끊김 — 재접속 중", true),
        });
        client.activate();
      }

      snapshot()
        .then(connect)
        .catch((e) => status("스냅샷 실패: " + e.message, true));
    </script>
  </body>
</html>
