<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locus — 관제</title>
    <!-- Leaflet(다크 타일=CARTO) + STOMP over WebSocket 실시간 푸시(M4b). 로직은 js/에, 스타일은 css/에. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="hud">
      <span class="brand">Locus 관제 <span id="hud-org" style="color: var(--muted)"></span></span>
      <span class="metric">전체 <b id="hud-total">0</b></span>
      <span class="metric">AMR <b id="hud-amr">0</b></span>
      <span class="metric">PHONE <b id="hud-phone">0</b></span>
      <span class="metric warn-count">경고 <b id="hud-warn">0</b></span>
      <span class="metric">수신 <b id="hud-rate">0</b>/s</span>
      <span class="spacer"></span>
      <span class="conn"><span id="hud-dot" class="dot"></span><span id="hud-conn">연결 중…</span></span>
    </div>

    <aside id="sidebar">
      <div id="filters">
        <button id="f-amr">AMR</button>
        <button id="f-phone">PHONE</button>
        <button id="f-offline">오프라인</button>
        <button id="f-estop">긴급정지</button>
        <button id="f-lowbat">저배터리</button>
      </div>
      <div id="sidebar-list"></div>
    </aside>

    <div id="map"></div>
    <div id="legend"></div>
    <section id="detail"></section>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <script src="/js/render.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
