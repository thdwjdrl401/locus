<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locus — 관제</title>
    <!-- Leaflet + OpenStreetMap 타일 (API 키 불필요). 실시간 푸시는 M4 — 지금은 폴링. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #map {
        height: 100%;
      }
      #hud {
        position: absolute;
        z-index: 1000;
        top: 10px;
        left: 50px;
        background: rgba(255, 255, 255, 0.92);
        padding: 8px 12px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 13px;
      }
      #hud b {
        font-size: 15px;
      }
      .stale {
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div>Locus 관제 — <b id="count">0</b>대</div>
      <div id="status" style="color: #666">…</div>
    </div>
    <div id="map"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const POLL_MS = 3000; // 폴링 주기. 실시간 푸시(WebSocket)는 M4.
      const map = L.map("map").setView([37.5, 127.0], 13); // 서울 근처(시뮬레이터 기본)
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap",
      }).addTo(map);

      const markers = new Map(); // deviceId -> L.marker
      const countEl = document.getElementById("count");
      const statusEl = document.getElementById("status");

      async function refresh() {
        try {
          const res = await fetch("/api/telemetry/latest", { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const list = await res.json();
          const seen = new Set();
          for (const t of list) {
            if (!t.location || t.location.lat == null || t.location.lng == null) continue;
            seen.add(t.deviceId);
            const ll = [t.location.lat, t.location.lng];
            const popup = `<b>${t.deviceId}</b><br/>${new Date(t.recordedAt).toLocaleTimeString()}`;
            let m = markers.get(t.deviceId);
            if (m) {
              m.setLatLng(ll).setPopupContent(popup);
            } else {
              m = L.marker(ll).addTo(map).bindPopup(popup);
              markers.set(t.deviceId, m);
            }
          }
          // 응답에서 사라진 디바이스는 마커 제거
          for (const [id, m] of markers) {
            if (!seen.has(id)) {
              map.removeLayer(m);
              markers.delete(id);
            }
          }
          countEl.textContent = markers.size;
          statusEl.textContent = "갱신: " + new Date().toLocaleTimeString();
          statusEl.style.color = "#666";
        } catch (e) {
          statusEl.textContent = "연결 실패: " + e.message;
          statusEl.style.color = "#c00";
        }
      }

      refresh();
      setInterval(refresh, POLL_MS);
    </script>
  </body>
</html>
