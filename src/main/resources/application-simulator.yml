# 시뮬레이터 프로파일 (결정 0005).
# 실행: ./gradlew bootRun --args='--spring.profiles.active=simulator'
locus:
  simulator:
    enabled: true
    # 타입별 가상 디바이스 수 (Java 21 가상 스레드 1대=1스레드). 폰+AMR 혼합으로 타입 추상화(M3)를 데모.
    phone-count: 40
    amr-count: 10
    # 전송 주기(ms)
    interval-ms: 1000
    # 텔레메트리 전송 대상 (자기 자신 또는 별도 서버 인스턴스)
    target-base-url: http://localhost:8093
  # 데모용 시드 지오펜스(M5). 측정 기본 설정을 안 건드리려고 시뮬 프로파일에만 둔다.
  # 로봇 존은 순찰 사각(odom 0~10m) 한가운데(5,5)에 반경 6m — 변 중앙은 안·코너는 밖이라
  # AMR가 각 변에서 경계를 넘나들며 루프당 ENTER/EXIT를 여러 번 낸다(37.5665/126.9780 사이트 기준).
  geofence:
    seeded:
      - id: robot-work-area
        org: org-0
        name: "로봇 작업구역"
        center-lat: 37.56654492
        center-lng: 126.97805667
        radius-meters: 6
      - id: phone-zone
        org: org-0
        name: "관제 구역(폰)"
        center-lat: 37.505
        center-lng: 127.005
        radius-meters: 500
