# 시뮬레이터 프로파일 (결정 0005).
# 실행: ./gradlew bootRun --args='--spring.profiles.active=simulator'
locus:
  ingest:
    # 시뮬레이터가 만드는 디바이스를 org-0에 넣는다. 이게 없으면 org=null이라 관제 화면이 빈 채로 뜬다
    # (지도는 ?org=org-0으로 조회하고 /topic/org/org-0을 구독, 지오펜스 시드 존도 org-0).
    # 조직 배정은 원래 enrollment(인증)의 일 — 인증 보류 동안의 데모 경로다.
    default-org: org-0
  simulator:
    enabled: true
    # 타입별 가상 디바이스 수 (Java 21 가상 스레드 1대=1스레드). 폰+AMR 혼합으로 타입 추상화(M3)를 데모.
    phone-count: 40
    amr-count: 10
    # 전송 주기(ms)
    interval-ms: 1000
    # 텔레메트리 전송 대상 (자기 자신 또는 별도 서버 인스턴스)
    target-base-url: http://localhost:8093
  # 데모용 시드 지오펜스(M5). 측정 기본 설정을 안 건드리려고 시뮬 프로파일에만 둔다.
  # 로봇 존은 순찰 사각(odom 0~200m) 한가운데(100,100)에 반경 120m — 변 중앙(중심에서 100m)은 안·
  # 코너(중심에서 141m)는 밖이라 AMR가 각 변에서 경계를 넘나들며 루프당 ENTER/EXIT를 여러 번 낸다.
  # 지도 줌에서 점이 아니라 형태로 보이게 10m→200m 루프로 확대(37.5665/126.9780 사이트 기준).
  geofence:
    seeded:
      - id: robot-work-area
        org: org-0
        name: "로봇 작업구역"
        center-lat: 37.56739832
        center-lng: 126.97913334
        radius-meters: 120
      - id: phone-zone
        org: org-0
        name: "관제 구역(폰)"
        center-lat: 37.505
        center-lng: 127.005
        radius-meters: 500
